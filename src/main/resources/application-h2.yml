jwt:
  secret:
    access: "${JWT_SECRET_ACCESS}"
    refresh: "${JWT_SECRET_REFRESH}"

server:
  tomcat:
    accept-count: 100
    threads:
      min-spare: 500
      max: 1000
    max-connections: 50000
  error:
    include-message: always

local:
  images:
    path: "${LOCAL_STORAGE_PATH:/Users/gimjingyu/Desktop/java/project/neopark/neopark/}"


spring:
  data:
    redis:
      host: "${REDIS_HOST:127.0.0.1}"
      port: "${REDIS_PORT:6379}"

  config:
    import:
      optional:file:spring.env[.properties]
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  #  h2:
  #    console:
  #      enabled: true
  #      path: /h2-console
  #      settings:
  #        web-allow-others: true
  #
  #  datasource:
  #    url: jdbc:h2:mem:testdb
  #    driver-class-name: org.h2.Driver
  #    username: sa
  #    password:

  # 환경변수를 통해 설정하는 대신, 테스트용으로 직접 값을 지정합니다.
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "${DB_URL:jdbc:mysql://localhost:3308/mydatabase}"  # 테스트용 DB URL (실제 테스트 환경에 맞게 수정)
    username: "${DB_USERNAME:dbuser}"       # DB 사용자
    password: "${DB_PASSWORD:dbpassword}"   # DB 비밀번호
    hikari:
      maximum-pool-size: 20              # 최대 20개의 커넥션을 사용 (DB max_connections 고려)
      minimum-idle: 10                    # 최소 10개의 유휴 커넥션을 유지하여 필요시 빠른 대응
      connection-timeout: 60000          # 60초 내에 커넥션을 획득하지 못하면 예외 발생
      idle-timeout: 300000               # 유휴 커넥션은 최대 5분까지 유지
      max-lifetime: 1800000              # 각 커넥션의 최대 수명을 30분으로 제한
      initialization-fail-timeout: 30000 # 초기 커넥션 생성에 실패하면 30초 동안 재시도
      leak-detection-threshold: 60000    # 60초 이상 사용된 커넥션에 대해 누수 경고 로깅 (문제 진단에 도움)
      # connection-test-query: SELECT 1  # JDBC4 이상에서는 불필요하나, 필요시 활성 커넥션 검증을 위해 사용
  jpa:
    hibernate:
      ddl-auto: update
      show-sql: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        show-sql: false
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
    generate-ddl: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: "${GOOGLE_CLIENT_ID}"
            client-secret: "${GOOGLE_CLIENT_SECRET}"
            scope:
              - "email"
              - "profile"

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: OFF
    org.hibernate: OFF
