spring:
  # 환경변수를 통해 설정하는 경우 아래 주석 해제 가능
  #config:
  #import: optional:file:env/spring-deploy.env[.properties]
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3308/mydatabase    # 테스트용 DB URL (실제 테스트 환경에 맞게 수정)
    username: dbuser                                 # 테스트용 DB 사용자
    password: dbpassword                             # 테스트용 DB 비밀번호

    profiles:
      include: oauth

  # 보안 관련 설정은 테스트에 필요없으므로 주석 처리
  # security:
  #   oauth2:
  #     client:
  #       registration:
  #         google:
  #           client-id: ${GOOGLE_CLIENT_ID}
  #           client-secret: ${GOOGLE_CLIENT_SECRET}
  #           scope: profile,email
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        show-sql: true
        format_sql: true
    database: mysql
    database-platform: org.hibernate.dialect.MySQL8Dialect
  # 파일 업로드 및 서블릿 관련 설정은 테스트에서 필요하지 않으므로 주석 처리
