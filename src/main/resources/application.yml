jwt:
  secret:
    access: "${JWT_SECRET_ACCESS}"
    refresh: "${JWT_SECRET_REFRESH}"


local:
  images:
    path: "${LOCAL_STORAGE_PATH}"

spring:
  # 환경변수를 통해 설정하는 경우 아래 주석 해제 가능
  config:
    import: optional:file:spring.env[.properties]

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "${DB_URL:jdbc:mysql://localhost:3308/mydatabase}"  # 테스트용 DB URL (실제 테스트 환경에 맞게 수정)
    username: "${DB_USERNAME:dbuser}"       # DB 사용자
    password: "${DB_PASSWORD:dbpassword}"   # DB 비밀번호

  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
    properties:
      hibernate:
        show-sql: true
        format_sql: true
    database: mysql
    database-platform: org.hibernate.dialect.MySQL8Dialect
  sql:
    init:
      mode: always

  data:
    redis:
      host: "${REDIS_HOST:127.0.0.1}"
      port: "${REDIS_PORT:6379}"

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: "${GOOGLE_CLIENT_ID}"
            client-secret: "${GOOGLE_CLIENT_SECRET}"
            scope:
              - "email"
              - "profile"
